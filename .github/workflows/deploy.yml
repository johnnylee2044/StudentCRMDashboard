name: Deploy React App to EC2

on:
  push:
    branches:
      - frontend-pos

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js and dependencies
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      # 3. Build the React app (production)
      - name: Build React app
        run: npm run build

      # 4. Add SSH key
      - name: Add SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # 5. Copy build folder to EC2
      - name: Upload build to EC2
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" build/ ec2-user@${{ secrets.EC2_IP }}:/tmp/build/

      # 6. Deploy on EC2 with Nginx
      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_IP }} << 'EOF'
            set -e
            sudo yum install -y nginx
            sudo systemctl enable nginx
            sudo systemctl start nginx

            # Clear old files and move new build
            sudo rm -rf /usr/share/nginx/html/*
            sudo mv /tmp/build/* /usr/share/nginx/html/

            # Configure SPA fallback
            if ! grep -q "try_files \$uri /index.html;" /etc/nginx/conf.d/react.conf 2>/dev/null; then
              echo '
              server {
                  listen 80;
                  server_name _;
                  root /usr/share/nginx/html;
                  index index.html;
                  location / {
                      try_files $uri /index.html;
                  }
              }' | sudo tee /etc/nginx/conf.d/react.conf
              sudo nginx -s reload
            fi
          EOF
